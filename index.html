<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WalkieTalkie – لايف</title>
<style>
  :root {
    --bg: #f3f2ee;
    --panel: #ffffff;
    --ink: #1d2320;
    --muted: #6b736e;
    --line: #dcdad2;
    --accent: #1f5d4a;
    --rec: #c8372d;
    --mine: #e4efe9;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Segoe UI", Tahoma, "Noto Naskh Arabic", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    display: flex;
    justify-content: center;
  }
  main {
    width: 100%;
    max-width: 560px;
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 12px;
  }
  h1 { font-size: 1.15rem; margin: 0; font-weight: 700; }
  .join { display: flex; gap: 8px; flex-wrap: wrap; }
  input {
    font: inherit;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    color: var(--ink);
    min-width: 0;
  }
  .join input { flex: 1 1 120px; }
  button {
    font: inherit;
    cursor: pointer;
    border: 0;
    border-radius: 8px;
    padding: 10px 16px;
    background: var(--accent);
    color: #fff;
  }
  button:focus-visible, input:focus-visible { outline: 3px solid #8fc3ad; outline-offset: 2px; }
  #status { font-size: 0.9rem; color: var(--muted); min-height: 1.4em; }
  #status.err { color: var(--rec); }
  #talking { min-height: 1.6em; text-align: center; color: var(--accent); font-weight: 600; }
  #log {
    flex: 1;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .msg { padding: 8px 12px; border-radius: 8px; background: var(--bg); max-width: 85%; word-break: break-word; }
  .msg.mine { background: var(--mine); align-self: flex-start; }
  .msg .who { font-size: 0.8rem; color: var(--muted); display: block; }
  #talk {
    height: 96px;
    font-size: 1.2rem;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #talk.rec { background: var(--rec); }
  #talk:disabled, #send:disabled { background: #9aa6a0; cursor: not-allowed; }
  .send { display: flex; gap: 8px; }
  .send input { flex: 1; }
  @media (prefers-reduced-motion: no-preference) {
    #talk { transition: background 0.15s; }
  }
</style>
</head>
<body>
<main>
  <h1>WalkieTalkie – نسخة اللاب توب (لايف)</h1>

  <div class="join">
    <input id="name" placeholder="اسمك" autocomplete="off">
    <input id="room" placeholder="اسم الغرفة" autocomplete="off">
    <input id="pass" type="password" placeholder="باسورد الغرفة" autocomplete="off">
    <button id="joinBtn">ادخل الغرفة</button>
  </div>
  <div id="status" role="status"></div>

  <div id="log" aria-live="polite"></div>

  <div id="talking" aria-live="polite"></div>
  <button id="talk" disabled>🎙 اضغط وتكلم</button>

  <div class="send">
    <input id="msg" placeholder="اكتب رسالة" autocomplete="off">
    <button id="send" disabled>إرسال</button>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
  // Same Firebase project as the Android app.
  // databaseURL must match the URL shown in Firebase > Realtime Database > Data.
  const firebaseConfig = {
    apiKey: "AIzaSyAaZYV2-DhfqZtmiOcYc_ksk0_rI6UoOYM",
    projectId: "walkietalkie-d2e40",
    databaseURL: "https://walkietalkie-d2e40-default-rtdb.firebaseio.com"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const rtdb = firebase.database();

  const RATE = 8000;
  const devId = (window.crypto && crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2))
    .replace(/-/g, "");

  const $ = id => document.getElementById(id);
  const logEl = $("log"), statusEl = $("status"), talk = $("talk"), sendBtn = $("send"), talkingEl = $("talking");

  let me = null, room = null, unsubChat = null, liveRef = null;
  let offset = 0;
  rtdb.ref(".info/serverTimeOffset").on("value", s => { offset = s.val() || 0; });

  function setStatus(t, isErr) {
    statusEl.textContent = t || "";
    statusEl.className = isErr ? "err" : "";
  }

  async function sha256(s) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
  }

  function msgs() {
    return db.collection("rooms").doc(room).collection("messages");
  }

  function addLine(sender, text) {
    const div = document.createElement("div");
    div.className = "msg" + (sender === me ? " mine" : "");
    const who = document.createElement("span");
    who.className = "who";
    who.textContent = sender;
    div.appendChild(who);
    div.appendChild(document.createTextNode(text || ""));
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
  }

  /* ---------- playback (live) ---------- */
  let actx = null, nextTime = 0, talkingTimer = null;

  function ensureCtx() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
  }

  function showTalking(name) {
    talkingEl.textContent = "🔊 " + name + " بيتكلم...";
    clearTimeout(talkingTimer);
    talkingTimer = setTimeout(() => { talkingEl.textContent = ""; }, 1500);
  }

  function playChunk(b64) {
    ensureCtx();
    const bin = atob(b64);
    const n = bin.length >> 1;
    if (!n) return;
    const f = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      let v = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8);
      if (v & 0x8000) v -= 0x10000;
      f[i] = v / 32768;
    }
    const buf = actx.createBuffer(1, n, RATE);
    buf.copyToChannel(f, 0);
    const src = actx.createBufferSource();
    src.buffer = buf;
    src.connect(actx.destination);
    const now = actx.currentTime;
    if (nextTime < now + 0.05) nextTime = now + 0.3;   // small jitter buffer
    src.start(nextTime);
    nextTime += buf.duration;
  }

  function startLive() {
    stopLive();
    liveRef = rtdb.ref("live/" + room);
    const handle = s => {
      if (s.key === devId) return;
      const v = s.val();
      if (!v || !v.d || typeof v.t !== "number") return;
      if (Date.now() + offset - v.t > 3000) return;   // ignore stale data
      showTalking(v.n || "؟");
      playChunk(v.d);
    };
    liveRef.on("child_added", handle);
    liveRef.on("child_changed", handle);
  }

  function stopLive() {
    if (liveRef) liveRef.off();
    liveRef = null;
  }

  /* ---------- join ---------- */
  $("joinBtn").onclick = async () => {
    const n = $("name").value.trim(), r = $("room").value.trim(), p = $("pass").value;
    if (!n || !r || !p) { setStatus("اكتبي الاسم والغرفة والباسورد", true); return; }
    ensureCtx();
    if (unsubChat) unsubChat();
    me = n;
    room = await sha256(r + ":" + p);
    logEl.innerHTML = "";
    unsubChat = msgs().orderBy("ts").onSnapshot(snap => {
      snap.docChanges().forEach(c => {
        if (c.type !== "added") return;
        const d = c.doc.data();
        if (d.type === "text") addLine(d.sender, d.text);
      });
    }, err => setStatus("خطأ: " + err.message, true));
    startLive();
    talk.disabled = false;
    sendBtn.disabled = false;
    setStatus("دخلتي الغرفة: " + r);
  };

  /* ---------- chat ---------- */
  function sendText() {
    const t = $("msg").value.trim();
    if (!room || !t) return;
    msgs().add({
      type: "text",
      sender: me,
      text: t,
      ts: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(e => setStatus("خطأ: " + e.message, true));
    $("msg").value = "";
  }
  sendBtn.onclick = sendText;
  $("msg").addEventListener("keydown", e => { if (e.key === "Enter") sendText(); });

  /* ---------- talk (live) ---------- */
  let held = false, talking = false, micStream = null, capCtx = null, proc = null, tRef = null, tStart = 0;

  function cleanupMic() {
    if (proc) { proc.disconnect(); proc.onaudioprocess = null; proc = null; }
    if (capCtx) { capCtx.close(); capCtx = null; }
    if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
    talk.classList.remove("rec");
    talk.textContent = "🎙 اضغط وتكلم";
  }

  async function startTalk() {
    if (!room || talking || held) return;
    held = true;
    try {
      micStream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true }
      });
    } catch (e) {
      held = false;
      setStatus("اسمحي للمتصفح باستخدام الميكروفون", true);
      return;
    }
    if (!held) { cleanupMic(); return; }   // released while the permission prompt was open

    capCtx = new (window.AudioContext || window.webkitAudioContext)();
    const src = capCtx.createMediaStreamSource(micStream);
    proc = capCtx.createScriptProcessor(4096, 1, 1);
    const ratio = capCtx.sampleRate / RATE;
    tRef = rtdb.ref("live/" + room + "/" + devId);
    tStart = Date.now();
    talking = true;

    proc.onaudioprocess = e => {
      if (!talking) return;
      if (Date.now() - tStart > 60000) { stopTalk(); return; }
      const inp = e.inputBuffer.getChannelData(0);
      const outLen = Math.floor(inp.length / ratio);
      const bytes = new Uint8Array(outLen * 2);
      for (let i = 0; i < outLen; i++) {
        const a = Math.floor(i * ratio);
        const b = Math.min(inp.length, Math.max(a + 1, Math.floor((i + 1) * ratio)));
        let sum = 0;
        for (let j = a; j < b; j++) sum += inp[j];
        const v = Math.max(-1, Math.min(1, sum / (b - a)));
        const s = Math.round(v * 32767);
        bytes[2 * i] = s & 255;
        bytes[2 * i + 1] = (s >> 8) & 255;
      }
      let bin = "";
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      tRef.set({ n: me, d: btoa(bin), t: firebase.database.ServerValue.TIMESTAMP });
    };

    src.connect(proc);
    proc.connect(capCtx.destination);
    talk.classList.add("rec");
    talk.textContent = "🔴 بتتكلم...";
  }

  function stopTalk() {
    held = false;
    const wasTalking = talking;
    talking = false;
    cleanupMic();
    if (wasTalking && tRef) { tRef.remove(); }
    tRef = null;
  }

  talk.addEventListener("pointerdown", e => { e.preventDefault(); startTalk(); });
  ["pointerup", "pointercancel", "pointerleave"].forEach(ev => talk.addEventListener(ev, stopTalk));
</script>
</body>
</html>
